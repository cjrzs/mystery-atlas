[project]
name = "mystery-atlas-analyzer"
version = "0.1.0"
description = "Background analysis pipeline for Mystery Atlas"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mystery_atlas_analyzer"]

