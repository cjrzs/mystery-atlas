[project]
name = "mystery-atlas-analyzer"
version = "0.1.0"
description = "Background analysis pipeline for Mystery Atlas"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mystery_atlas_analyzer"]
